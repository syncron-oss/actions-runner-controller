# Syncs master with actions/actions-runner-controller daily.
# Uses a GitHub App token when SYNC_APP_ID/SYNC_APP_PEM are set: the default
# GITHUB_TOKEN can't sync upstream changes under .github/workflows/.
name: syncron-sync-upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  sync:
    if: github.repository == 'syncron-oss/actions-runner-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        if: vars.SYNC_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PEM }}

      - name: Merge upstream into master
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master
